[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-needs-agent"
version = "0.1.0"
description = "面向企业软件选型的客户需求分析 Agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Customer Needs Agent Contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.60,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
agent = "customer_needs_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_needs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["customer_needs_agent"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

